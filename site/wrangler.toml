name = "noc-checkin-local"
main = "worker.js"
compatibility_date = "2026-10-25"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "noc-checkin-local"
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
TEAM_CODE = "LOCAL-TEST-CODE"
